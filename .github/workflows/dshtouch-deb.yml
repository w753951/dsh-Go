# 产出三个签名变体，用来定位 Killed: 9 的原因。
name: dshtouch deb

on:
  push:
    branches: ['ios/**']
    paths:
      - 'tooling/ios/cli/**'
      - '.github/workflows/dshtouch-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dshtouch-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -fobjc-arc -O2 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -o dshtouch tooling/ios/cli/dshtouch.m
          xcrun lipo dshtouch -verify_arch arm64
          strip dshtouch || true
          ls -lh dshtouch
          brew install ldid || true

      - name: Sign three variants
        run: |
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          mkdir -p out

          # A：纯 ad-hoc，不带任何 entitlements。先证明这个二进制能跑。
          cp dshtouch "out/dshtouch-a-plain"
          "$LLDID" -S "out/dshtouch-a-plain"
          echo "=== A: plain ad-hoc ==="
          "$LLDID" -e "out/dshtouch-a-plain" || true

          # B：只加 no-sandbox，不加 platform-application。
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>com.apple.private.security.no-sandbox</key><true/>' \
            '</dict></plist>' > ent-b.plist
          cp dshtouch "out/dshtouch-b-nosandbox"
          "$LLDID" -Sent-b.plist "out/dshtouch-b-nosandbox"
          echo "=== B: no-sandbox ==="
          "$LLDID" -e "out/dshtouch-b-nosandbox"

          # C：no-sandbox + hid，仍然不带 platform-application。
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>com.apple.private.security.no-sandbox</key><true/>' \
            '  <key>com.apple.private.hid.client.event-dispatch</key><true/>' \
            '</dict></plist>' > ent-c.plist
          cp dshtouch "out/dshtouch-c-hid"
          "$LLDID" -Sent-c.plist "out/dshtouch-c-hid"
          echo "=== C: no-sandbox + hid ==="
          "$LLDID" -e "out/dshtouch-c-hid"

          ls -lh out/

      - name: Package each variant
        run: |
          for variant in a-plain b-nosandbox c-hid; do
            python3 tooling/ios/cli/make-deb.py "out/dshtouch-$variant" || exit 1
            mv dshtouch_1.0.0_iphoneos-arm64.deb "out/dshtouch-$variant.deb"
          done
          ls -lh out/*.deb

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dshtouch-variants
          path: ${{ github.workspace }}/out/
          if-no-files-found: error
          retention-days: 30