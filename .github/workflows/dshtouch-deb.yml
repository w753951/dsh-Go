# 把 dshtouch 打成 rootless deb，Sileo 装完直接可用，
# 不需要手动放文件、改权限或处理 /var/jb 的写保护。
name: dshtouch deb

on:
  push:
    branches: ['ios/**']
    paths:
      - 'tooling/ios/cli/dshtouch.m'
      - 'tooling/ios/cli/deb/**'
      - '.github/workflows/dshtouch-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dshtouch-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PKG: com.dshgo.dshtouch
      VERSION: 1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -fobjc-arc -O2 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -o dshtouch tooling/ios/cli/dshtouch.m
          xcrun lipo dshtouch -verify_arch arm64
          strip dshtouch || true
          ls -lh dshtouch

      - name: Sign for jailbreak
        run: |
          brew install ldid || true
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          cat > dshtouch.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-sandbox</key><true/>
            <key>com.apple.private.hid.client.event-dispatch</key><true/>
          </dict>
          </plist>
          PLIST
          "$LLDID" -Sdshtouch.entitlements dshtouch
          "$LLDID" -e dshtouch

      - name: Assemble the deb
        run: |
          set -euo pipefail
          root="build"
          rm -rf "$root"
          mkdir -p "$root/DEBIAN"
          # rootless: 安装到 /var/jb 下，Sileo 负责映射。
          mkdir -p "$root/var/jb/usr/bin"
          cp dshtouch "$root/var/jb/usr/bin/dshtouch"
          chmod 755 "$root/var/jb/usr/bin/dshtouch"

          cat > "$root/DEBIAN/control" <<EOF
          Package: ${PKG}
          Name: dshtouch
          Version: ${VERSION}
          Architecture: iphoneos-arm64
          Description: 命令行操控工具（点击、滑动、输入、开应用、抓屏）
          Maintainer: DSH Go build
          Author: DSH Go build
          Section: Utilities
          Depends: firmware (>= 15.0)
          EOF

          # 装完把权限和所有者再钉一次，避免解包行为差异。
          cat > "$root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          TARGET=/var/jb/usr/bin/dshtouch
          [ -f "$TARGET" ] || TARGET=/usr/bin/dshtouch
          if [ -f "$TARGET" ]; then
            chmod 755 "$TARGET" || true
            chown root:wheel "$TARGET" || true
          fi
          exit 0
          EOF
          chmod 755 "$root/DEBIAN/postinst"

          cat > "$root/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          exit 0
          EOF
          chmod 755 "$root/DEBIAN/prerm"

          # 固定时间戳和属主，产出可复现的包。
          find "$root" -exec touch -h -d '2026-01-01T00:00:00Z' {} + || true

          dpkg-deb --build --root-owner-group "$root" "dshtouch_${VERSION}_iphoneos-arm64.deb"
          ls -lh *.deb
          echo "=== contents ==="
          dpkg-deb -c "dshtouch_${VERSION}_iphoneos-arm64.deb"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dshtouch-deb
          path: ${{ github.workspace }}/dshtouch_*.deb
          if-no-files-found: error
          retention-days: 30