# 把 dshtouch 打成 rootless deb，Sileo 装完直接可用。
# 打包逻辑在 tooling/ios/cli/make-deb.py，不嵌在 YAML 里，避免缩进问题。
name: dshtouch deb

on:
  push:
    branches: ['ios/**']
    paths:
      - 'tooling/ios/cli/**'
      - '.github/workflows/dshtouch-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dshtouch-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -fobjc-arc -O2 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -o dshtouch tooling/ios/cli/dshtouch.m
          xcrun lipo dshtouch -verify_arch arm64
          strip dshtouch || true
          ls -lh dshtouch

      - name: Sign for jailbreak
        run: |
          brew install ldid || true
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>platform-application</key><true/>' \
            '  <key>com.apple.private.security.no-sandbox</key><true/>' \
            '  <key>com.apple.private.hid.client.event-dispatch</key><true/>' \
            '</dict>' \
            '</plist>' > dshtouch.entitlements
          "$LLDID" -Sdshtouch.entitlements dshtouch
          "$LLDID" -e dshtouch

      - name: Assemble the deb
        run: |
          python3 tooling/ios/cli/make-deb.py dshtouch
          ls -lh *.deb

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dshtouch-deb
          path: ${{ github.workspace }}/dshtouch_*.deb
          if-no-files-found: error
          retention-days: 30