name: Build jailbreak plugin

# 单独编译注入 SpringBoard 的截图插件，产物是一个 .deb。
# 和 App 的构建互不影响，可以并行跑。

on:
  workflow_dispatch:
  push:
    branches: ['ios/**']
    paths:
      - 'jbplugin/**'
      - '.github/workflows/jb-plugin.yml'

permissions:
  contents: read

concurrency:
  group: jb-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Select Xcode
        run: |
          pick="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$pick" || { echo '::error title=xcode::no Xcode found'; exit 1; }
          echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          "$pick/Contents/Developer/usr/bin/xcodebuild" -version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dpkg and ldid
        run: |
          # macOS 的 runner 自带 dpkg-deb（在 /usr/local/bin），没有就用 brew。
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            brew install dpkg || true
          fi
          command -v dpkg-deb && dpkg-deb --version | head -1
          # ldid 用来给 dshtool 签平台级授权。macOS runner 默认没有，
          # 必须装：没有它 dshtool 就是未签名二进制，HID 事件会被内核丢弃，
          # 于是「点击无反应」而日志里一切正常。
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || brew install ProcursusTeam/ldid/ldid || true
          fi
          command -v ldid && ldid -v 2>&1 | head -1 || echo 'ldid still missing'

      - name: Compile the tweak
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          mkdir -p build/DEBIAN build/Library/MobileSubstrate/DynamicLibraries
          # 目标设备是 iOS 15.0 / arm64。产物不签名：TrollStore 安装不走代码
          # 签名校验，SpringBoard 加载 dylib 也不需要签名。
          # 用 bash 数组拼参数，避免 YAML 里的反斜杠续行被当成字面量。
          args=(
            -arch arm64
            -miphoneos-version-min=15.0
            -isysroot "$SDK"
            -dynamiclib
            -fobjc-arc
            -O2
            -framework Foundation
            -framework UIKit
            -framework CoreGraphics
            -o build/Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib
            jbplugin/DshScreenshotService.m
          )
          xcrun --sdk iphoneos clang "${args[@]}"
          echo "=== 产物 ==="
          file build/Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib
          lipo -info build/Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib
          cp jbplugin/DshScreenshotService.plist build/Library/MobileSubstrate/DynamicLibraries/
          # 探针：极少代码，只写一行日志。用来单独验证注入机制是否接受我们的 dylib。
          # 同样用数组，不写反斜杠续行：YAML 里续行容易被吃掉或变成字面量。
          probe_args=(
            -arch arm64
            -miphoneos-version-min=15.0
            -isysroot "$SDK"
            -dynamiclib
            -fobjc-arc
            -O1
            -framework Foundation
            -o build/Library/MobileSubstrate/DynamicLibraries/DshProbe.dylib
            jbplugin/DshProbe.m
          )
          xcrun --sdk iphoneos clang "${probe_args[@]}"
          cp jbplugin/DshScreenshotService.plist build/Library/MobileSubstrate/DynamicLibraries/DshProbe.plist
          echo "=== 探针 ==="
          file build/Library/MobileSubstrate/DynamicLibraries/DshProbe.dylib

          # XinaA15 的 TweakInject 只认 FAT（通用二进制）形态的 dylib：
          # 已生效的插件（Snapper3、ChoicySB 等）头都是 cafebabe，而 clang 直接
          # 产出的是 thin（cffaedfe），这样的文件会被静默跳过——既不报错也不加载。
          # 所以这里把 thin 重新包成 FAT：同一份 arm64 代码放进 fat 容器。
          for name in DshScreenshotService DshProbe; do
            thin="build/Library/MobileSubstrate/DynamicLibraries/$name.dylib"
            fat="build/Library/MobileSubstrate/DynamicLibraries/$name.fat.dylib"
            # create_fat 需要一个输入文件；用 -arch arm64 明确标注架构。
            lipo -create -arch arm64 "$thin" -output "$fat"
            mv "$fat" "$thin"
            echo "--- $name 现在是 ---"
            lipo -info "$thin"
            od -A d -t x1 -N 4 "$thin"
          done
          cp jbplugin/control build/DEBIAN/control

          # dshtool：root 下的读屏与点按命令行工具。
          # 它不依赖插件注入，App 通过本机 sshd 调用它，因此绕开了
          # 「沙盒进程看不到别的 App」这个根本限制。
          mkdir -p build/usr/bin
          tool_args=(
            -arch arm64
            -miphoneos-version-min=15.0
            -isysroot "$SDK"
            -fobjc-arc
            -O2
            -framework Foundation
            -framework UIKit
            -framework CoreGraphics
            -o build/usr/bin/dshtool
            jbplugin/dshtool.m
          )
          xcrun --sdk iphoneos clang "${tool_args[@]}"
          echo "=== dshtool ==="
          file build/usr/bin/dshtool
          # root 下 exec 需要有效签名；用平台级授权签，读屏和 HID 才可用。
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          if [ ! -x "$LLDID" ]; then
            echo '::error title=ldid::ldid 缺失，dshtool 无法签名，HID 不会生效'
            exit 1
          fi
          "$LLDID" -Sjbplugin/ent-dshtool.plist build/usr/bin/dshtool
          echo "已用 ldid 签名"
          # 逐项断言授权真的进了二进制。以前这里只打了一行 warning 就继续，
          # 结果产出一个未签名的工具，点击静默失效，排查了很久。
          for key in platform-application com.apple.private.hid.client.event-dispatch \
                     com.apple.private.security.no-sandbox; do
            "$LLDID" -e build/usr/bin/dshtool | grep -q "$key" \
              || { echo "::error title=entitlements::dshtool 缺 $key"; exit 1; }
          done
          echo "授权检查通过"

      - name: Package the deb
        run: |
          set -euo pipefail
          chmod -R 0755 build/Library
          chmod 0755 build/usr/bin/dshtool
          chmod 0644 build/Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.plist
          chmod 0644 build/DEBIAN/control
          SIZE=$(du -sk build | cut -f1)
          echo "Installed-Size: $SIZE" >> build/DEBIAN/control
          # dpkg-deb 在 macOS 上来自 brew；没有就报清楚。
          command -v dpkg-deb >/dev/null 2>&1 || { echo '::error title=dpkg::dpkg-deb missing'; exit 1; }
          dpkg-deb --build --root-owner-group build DshScreenService.deb
          ls -la DshScreenService.deb
          dpkg-deb -I DshScreenService.deb
          dpkg-deb -c DshScreenService.deb

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jb-screen-deb
          path: DshScreenService.deb
          if-no-files-found: error
