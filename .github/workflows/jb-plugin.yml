name: Build jailbreak plugin

# 单独编译注入 SpringBoard 的截图插件，产物是一个 .deb。
# 和 App 的构建互不影响，可以并行跑。

on:
  workflow_dispatch:
  push:
    branches: ['ios/**']
    paths:
      - 'jbplugin/**'
      - '.github/workflows/jb-plugin.yml'

permissions:
  contents: read

concurrency:
  group: jb-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Select Xcode
        run: |
          pick="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$pick" || { echo '::error title=xcode::no Xcode found'; exit 1; }
          echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          "$pick/Contents/Developer/usr/bin/xcodebuild" -version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the tweak
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          mkdir -p build/DEBIAN build/Library/MobileSubstrate/DynamicLibraries
          # 目标设备是 iOS 15.0 / arm64，未签名（TrollStore 安装不走代码签名校验，
          # SpringBoard 加载 dylib 也不需要签名）。
          xcrun --sdk iphoneos clang \\
            -arch arm64 -miphoneos-version-min=15.0 \\
            -isysroot "$SDK" \\
            -dynamiclib -fobjc-arc -O2 \\
            -framework Foundation -framework UIKit \\
            -install_name /Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib \\
            -o build/Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib \\
            jbplugin/DshScreenshotService.m
          echo "=== 产物 ==="
          file build/Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib
          lipo -info build/Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib
          cp jbplugin/DshScreenshotService.plist build/Library/MobileSubstrate/DynamicLibraries/
          cp jbplugin/control build/DEBIAN/control

      - name: Package the deb
        run: |
          set -euo pipefail
          cd build
          # rootless 环境实际路径带 /var/jb 前缀，dpkg 由越狱环境安装时自动处理；
          # 这里按 rootless 的布局打，安装后被放到 /var/jb/Library/...。
          chmod -R 0755 Library
          chmod 0644 Library/MobileSubstrate/DynamicLibraries/*.plist
          chmod 0644 DEBIAN/control
          SIZE=$(du -sk . | cut -f1)
          echo "Installed-Size: $SIZE" >> DEBIAN/control
          cd ..
          dpkg-deb --build --root-owner-group build DshScreenService.deb || \\
            dpkg-deb -b build DshScreenService.deb
          ls -la DshScreenService.deb
          dpkg-deb -I DshScreenService.deb
          dpkg-deb -c DshScreenService.deb

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jb-screen-deb
          path: DshScreenService.deb
          if-no-files-found: error
