# Builds the app for a physical iPhone, unsigned, and packages it as an .ipa.
# Trimmed from the repository's own workflow: the simulator round trips are
# dropped, the iOS 15.0 deployment target is asserted, and the only artifact is
# the unsigned ipa a TrollStore device installs.
name: iOS build IPA

on:
  push:
    branches: ['feat/ios-**', 'ios/**']
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image (macos-26 has Xcode 26; macos-15 is easier to get)'
        required: false
        default: macos-26
        type: string

permissions:
  contents: read

concurrency:
  group: ios-build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # macos-26 容量紧张时会长时间排队；用它时要保证 Xcode 26 存在，
    # 换到别的镜像则由下面的 “Select Xcode” 步骤挑最新的一个。
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 150
    env:
      DSH_IOS_ENGINE_WORK: ${{ github.workspace }}/../engine-work
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
    steps:
      - name: Select Xcode
        run: |
          echo "runner: ${{ inputs.runner || 'macos-26' }}"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(no Xcode in /Applications)"
          # 优先 Xcode 26；否则取版本号最大的一个。
          pick="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$pick" ]; then
            pick="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$pick" || { echo '::error title=xcode::no Xcode found'; exit 1; }
          echo "using $pick"
          echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          "$pick/Contents/Developer/usr/bin/xcodebuild" -version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Prepare the engine
        run: |
          bash tooling/ios/prepare-engine.sh
          ls -la app/ios/Engine

      - name: Install the iSH build tools
        run: |
          brew install llvm lld
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install meson==1.7.2 ninja==1.11.1.4
          echo "$RUNNER_TEMP/ish-tools/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix lld)/bin:$PATH" ld.lld --version

      - name: Build the iSH guest frameworks for the device
        run: |
          out="app/ios/Engine/build/iphoneos/guest"
          bash tooling/ios/build-guest-addon.sh iphoneos "$out"
          ls -la "$out"

      - name: Build the engine native frameworks for the device
        run: |
          bash tooling/ios/build-engine-native.sh iphoneos "$RUNNER_TEMP/device"
          ls -la "$RUNNER_TEMP/device"

      - name: Install Flutter
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: Check the iOS 15.0 deployment target
        run: |
          pbx=app/ios/Runner.xcodeproj/project.pbxproj
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' "$pbx"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "$pbx" || {
            echo '::error title=deployment target::the app has no iOS 15.0 deployment target'; exit 1; }
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;' "$pbx" && \
            echo '::warning title=deployment target::16.0 is present; it must belong to the PhoneRunner target only'

      - name: Build the app for a device, unsigned
        working-directory: app
        # 签名开关由 tooling/ios/build.sh 传给 xcodebuild：Flutter 的
        # --no-codesign 只跳过产物签名，工程里 CODE_SIGN_STYLE = Automatic
        # 仍会让它去找 Development Team，找不到就报错。
        run: bash ../tooling/ios/build.sh --release --no-codesign

      - name: Bundle the built-in plugin
        run: |
          app="app/build/ios/iphoneos/Runner.app"
          dest="$app/builtin-plugins/dsh-our-free-model"
          mkdir -p "$dest"
          # 按插件自己的 files 清单取；win32 引擎分片 iOS 用不上，去掉省 31 MB。
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ofm.tar.gz" \
            https://codeload.github.com/Ebony-Vinyl/dsh-our-free-model/tar.gz/refs/heads/main
          mkdir -p "$RUNNER_TEMP/ofm"
          tar -xzf "$RUNNER_TEMP/ofm.tar.gz" -C "$RUNNER_TEMP/ofm" --strip-components=1
          src="$RUNNER_TEMP/ofm"
          for item in index.js client.js adapter locale icon.svg cordis.patch.yml LICENSE package.json; do
            [ -e "$src/$item" ] && cp -R "$src/$item" "$dest/" || true
          done
          mkdir -p "$dest/src"
          find "$src/src" -maxdepth 1 -name '*.js' -exec cp {} "$dest/src/" \;
          for dir in providers route; do
            [ -d "$src/src/$dir" ] && cp -R "$src/src/$dir" "$dest/src/" || true
          done
          mkdir -p "$dest/vendor"
          [ -d "$src/vendor/channel-pack" ] && cp -R "$src/vendor/channel-pack" "$dest/vendor/" || true
          [ -d "$src/vendor/magpie" ] && cp -R "$src/vendor/magpie" "$dest/vendor/" || true
          test -f "$dest/index.js" || { echo '::error title=plugin::the built-in plugin did not land'; exit 1; }
          echo "built-in plugin size: $(du -sh "$dest" | cut -f1)"
      - name: Sign with the HID entitlement
        run: |
          brew install ldid || true
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          app="app/build/ios/iphoneos/Runner.app"
          # 只签 HID 授权。带 no-sandbox 的变体（ent-jailbreak.plist）在 XinaA15 上
          # 会被 TrollStore 直接拒绝安装，连旧版一起卸掉，所以不用它。
          # 读屏本身不需要它：越狱通道的抓屏在沙盒里就能出图，
          # 之前读屏失败是帧号不是 UUID（已在 IOSPhoneCoreDevice 修掉）。
          ent="app/ios/Runner/ent-hidonly.plist"
          test -f "$ent" || { echo '::error title=entitlements::missing'; exit 1; }
          echo "Frameworks embedded:"; ls "$app/Frameworks"
          echo "built-in plugin:"; du -sh "$app/builtin-plugins" 2>/dev/null || echo none
          # 只签主二进制：TrollStore 从这里读 entitlements 再签整包。
          # 绝不能对 App.framework/App 跑 ldid，Dart AOT 快照会校验失败。
          "$LLDID" -S"$ent" "$app/Runner"
          echo "=== entitlements ==="
          "$LLDID" -e "$app/Runner"
          "$LLDID" -e "$app/Runner" | grep -q 'hid.client.event-dispatch' \
            || { echo '::error title=entitlements::hid entitlement did not land'; exit 1; }
          rm -rf "$RUNNER_TEMP/ip"; mkdir -p "$RUNNER_TEMP/ip/Payload"
          cp -R "$app" "$RUNNER_TEMP/ip/Payload/"
          (cd "$RUNNER_TEMP/ip" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/DSH-Go.ipa")
          du -h "$RUNNER_TEMP/DSH-Go.ipa"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist" || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: |
            ${{ runner.temp }}/DSH-Go.ipa
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14