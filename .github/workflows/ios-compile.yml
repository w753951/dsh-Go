# Builds the app for a physical iPhone, unsigned, and packages it as an .ipa.
# fork build: registered on 1154246183
# Trimmed from the repository's own workflow: the simulator round trips are
# dropped, the iOS 15.0 deployment target is asserted, and the only artifact is
# the unsigned ipa a TrollStore device installs.
name: iOS build IPA

on:
  push:
    branches: ['feat/ios-**', 'ios/**']
    # 只在这些路径变化时构建 App。改插件、文档不该牵动一次二十多分钟的编译，
    # 更不该把正在跑的那次取消掉。
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image (macos-26 has Xcode 26; macos-15 is easier to get)'
        required: false
        default: macos-26
        type: string

permissions:
  contents: write

concurrency:
  # 每次 run 自成一个组：踩过的坑是同一分支多次触发（push + 手动 dispatch
  # 交替来）共用一个组时，新来的会把还排着队的那个顶成 cancelled，看起来
  # 像构建失败。编译二十多分钟，宁可多跑一个也不要白等。
  group: ios-build-ipa-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ipa:
    # macos-26 容量紧张时会长时间排队；用它时要保证 Xcode 26 存在，
    # 换到别的镜像则由下面的 “Select Xcode” 步骤挑最新的一个。
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 150
    env:
      DSH_IOS_ENGINE_WORK: ${{ github.workspace }}/../engine-work
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
    steps:
      - name: Select Xcode
        run: |
          echo "runner: ${{ inputs.runner || 'macos-26' }}"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(no Xcode in /Applications)"
          # 优先 Xcode 26；否则取版本号最大的一个。
          pick="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$pick" ]; then
            pick="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$pick" || { echo '::error title=xcode::no Xcode found'; exit 1; }
          echo "using $pick"
          echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          "$pick/Contents/Developer/usr/bin/xcodebuild" -version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Prepare the engine
        run: |
          bash tooling/ios/prepare-engine.sh
          ls -la app/ios/Engine

      - name: Install the iSH build tools
        run: |
          brew install llvm lld
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install meson==1.7.2 ninja==1.11.1.4
          echo "$RUNNER_TEMP/ish-tools/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix lld)/bin:$PATH" ld.lld --version

      - name: Build the iSH guest frameworks for the device
        run: |
          out="app/ios/Engine/build/iphoneos/guest"
          bash tooling/ios/build-guest-addon.sh iphoneos "$out"
          ls -la "$out"

      - name: Build the engine native frameworks for the device
        run: |
          bash tooling/ios/build-engine-native.sh iphoneos "$RUNNER_TEMP/device"
          ls -la "$RUNNER_TEMP/device"

      - name: Install Flutter
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: Check the iOS 15.0 deployment target
        run: |
          pbx=app/ios/Runner.xcodeproj/project.pbxproj
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' "$pbx"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "$pbx" || {
            echo '::error title=deployment target::the app has no iOS 15.0 deployment target'; exit 1; }
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;' "$pbx" && \
            echo '::warning title=deployment target::16.0 is present; it must belong to the PhoneRunner target only'

      - name: Analyze Dart before the expensive build
        working-directory: app
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^\s+error •' /tmp/analyze.log | head -40 | sed 's/%/%25/g' | sed 's/^/::error title=dart::/'
          fi
          exit "$status"

      - name: Build the app for a device, unsigned
        working-directory: app
        # 签名开关由 tooling/ios/build.sh 传给 xcodebuild：Flutter 的
        # --no-codesign 只跳过产物签名，工程里 CODE_SIGN_STYLE = Automatic
        # 仍会让它去找 Development Team，找不到就报错。
        run: bash ../tooling/ios/build.sh --release --no-codesign

      - name: Bundle the built-in plugin
        run: |
          app="app/build/ios/iphoneos/Runner.app"
          dest="$app/builtin-plugins/dsh-our-free-model"
          mkdir -p "$dest"
          # 按插件自己的 files 清单取；win32 引擎分片 iOS 用不上，去掉省 31 MB。
          #
          # 钉在 e05742d170，不要跟 main：上游 2026-11-22 11:24 的 2f305c83
          # 「engine: 内嵌纯净上游 magpie」把 magpie 整份塞进 vendor，这个插件
          # 从 78M 涨到 107M，IPA 跟着从 144M 涨到 161M。跟 main 就随上游飘，
          # 包体和可用性都不受这里控制。
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ofm.tar.gz" \
            https://codeload.github.com/Ebony-Vinyl/dsh-our-free-model/tar.gz/e05742d170
          mkdir -p "$RUNNER_TEMP/ofm"
          tar -xzf "$RUNNER_TEMP/ofm.tar.gz" -C "$RUNNER_TEMP/ofm" --strip-components=1
          src="$RUNNER_TEMP/ofm"
          for item in index.js client.js adapter locale icon.svg cordis.patch.yml LICENSE package.json; do
            [ -e "$src/$item" ] && cp -R "$src/$item" "$dest/" || true
          done
          mkdir -p "$dest/src"
          find "$src/src" -maxdepth 1 -name '*.js' -exec cp {} "$dest/src/" \;
          for dir in providers route; do
            [ -d "$src/src/$dir" ] && cp -R "$src/src/$dir" "$dest/src/" || true
          done
          mkdir -p "$dest/vendor"
          [ -d "$src/vendor/channel-pack" ] && cp -R "$src/vendor/channel-pack" "$dest/vendor/" || true
          [ -d "$src/vendor/magpie" ] && cp -R "$src/vendor/magpie" "$dest/vendor/" || true
          test -f "$dest/index.js" || { echo '::error title=plugin::the built-in plugin did not land'; exit 1; }
          echo "built-in plugin size: $(du -sh "$dest" | cut -f1)"

      - name: Bundle dsh-purge
        run: |
          # dsh-purge：按它 package.json 的 files 清单打包。
          # 来源是 kingcharleslzy-ai/dsh-purge（社区维护版）。**不要用
          # mmparko/dsh-purge**：那个版本会无条件往 prompt 里写 {{cwd}}，
          # 而本机引擎只注册了 provider/model 两个变量，于是每一轮都报
          # unknown prompt variable 直接失败。这个版本会先探测
          # assembled.variables 里有没有 cwd，没有就退回静态文本。
          # 依赖只有 peer 的 @deepseek-ai/cordis（由宿主提供），整份复制即可。
          app="app/build/ios/iphoneos/Runner.app"
          dest="$app/builtin-plugins/dsh-purge-community"
          mkdir -p "$dest"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/purge.tar.gz" \
            https://codeload.github.com/kingcharleslzy-ai/dsh-purge/tar.gz/refs/heads/master
          mkdir -p "$RUNNER_TEMP/purge"
          tar -xzf "$RUNNER_TEMP/purge.tar.gz" -C "$RUNNER_TEMP/purge" --strip-components=1
          src="$RUNNER_TEMP/purge"
          # files 清单：lib bin docs presets skills scripts client.js
          # cordis.patch.yml screenshots.json README*.md LICENSE，另加 package.json。
          # 注意 lib/default-prompt-inject.md 被上游 .npmignore 排除，这里照做。
          for item in lib bin docs presets skills scripts locale packages market; do
            [ -d "$src/$item" ] && cp -R "$src/$item" "$dest/" || true
          done
          for item in client.js cordis.patch.yml screenshots.json package.json LICENSE \
                      NOTICE.md CONTRIBUTORS.md AGENTS.md icon.png \
                      README.md README.zh-CN.md; do
            [ -e "$src/$item" ] && cp "$src/$item" "$dest/" || true
          done
          rm -f "$dest/lib/default-prompt-inject.md"
          # 目录名必须和 Dart 侧 BuiltinPlugins.bundled 里的名字一致，
          # 否则 App 启动时找不到源目录，插件会被静默跳过（以前就是
          # bundled 写 'dsh-purge'、这里打包成 dsh-purge-community，
          # 结果破甲一直没被加载）。包名也必须是这个。
          name="$(sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$dest/package.json" | head -1)"
          if [ "$name" != "dsh-purge-community" ]; then
            echo "::error title=plugin::dsh-purge 的 package.json name=$name，与 packed 目录名 dsh-purge-community 不一致，App 侧找不到它"; exit 1
          fi
          # 主入口必须在，否则装上也启用不了。
          test -f "$dest/lib/index.js" || {
            echo '::error title=plugin::dsh-purge 的 lib/index.js 没落进包里'; exit 1; }
          test -f "$dest/package.json" || {
            echo '::error title=plugin::dsh-purge 的 package.json 没落进包里'; exit 1; }
          echo "dsh-purge size: $(du -sh "$dest" | cut -f1)"
          ls -la "$dest"

      - name: Bundle dsh-media (image & video)
        run: |
          # 图像与视频：源码就在本仓库 runtime/media/dsh-media，不走 npm，
          # 构建可复现。整份 src/ 复制：package.json 的 files 清单已过时，
          # 实际还有 provider-client / provider-protocol / generated-digests。
          # test/ 不进包。
          app="app/build/ios/iphoneos/Runner.app"
          dest="$app/builtin-plugins/@ccch1mneyyy/dsh-media"
          src="runtime/media/dsh-media"
          test -f "$src/package.json" || {
            echo '::error title=plugin::runtime/media/dsh-media 不在仓库里'; exit 1; }
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R "$src/src" "$dest/src"
          cp -R "$src/data" "$dest/data"
          [ -d "$src/locale" ] && cp -R "$src/locale" "$dest/locale" || true
          rm -rf "$dest/src/test" "$dest/test"
          for item in package.json cordis.patch.yml README.md LICENSE; do
            [ -e "$src/$item" ] && cp "$src/$item" "$dest/" || true
          done
          test -f "$dest/src/index.js" || {
            echo '::error title=plugin::dsh-media 的 src/index.js 没落进包里'; exit 1; }

          # 唯一的第三方运行时依赖：image-size 2.0.2（package.json 钉死）。
          # @deepseek-ai/* 都是 peer，由宿主运行时提供，不打进来。
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/image-size.tgz" https://registry.npmjs.org/image-size/-/image-size-2.0.2.tgz
          mkdir -p "$RUNNER_TEMP/image-size"
          tar -xzf "$RUNNER_TEMP/image-size.tgz" -C "$RUNNER_TEMP/image-size" --strip-components=1
          rm -rf "$dest/node_modules"
          mkdir -p "$dest/node_modules"
          cp -R "$RUNNER_TEMP/image-size" "$dest/node_modules/image-size"
          test -f "$dest/node_modules/image-size/dist/index.mjs" || {
            echo '::error title=plugin::image-size 没落进包里'; exit 1; }
          echo "dsh-media size: $(du -sh "$dest" | cut -f1)"
          ls -la "$dest"

      - name: Bundle local-tickflow (stocks)
        run: |
          # 炒股：源码在 runtime/local-tickflow。只带代码与 sql 建表脚本，
          # data/tickflow.db 是运行时生成的行情库，不进包。
          app="app/build/ios/iphoneos/Runner.app"
          dest="$app/builtin-plugins/local-tickflow"
          src="runtime/local-tickflow"
          test -f "$src/package.json" || {
            echo '::error title=plugin::runtime/local-tickflow 不在仓库里'; exit 1; }
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R "$src/lib" "$dest/lib"
          cp -R "$src/sql" "$dest/sql"
          for item in package.json cordis.patch.yml README.md; do
            [ -e "$src/$item" ] && cp "$src/$item" "$dest/" || true
          done
          # 干净的首启状态：建表脚本在，库由插件自己 mkdir + DatabaseSync 出来。
          rm -rf "$dest/data"
          test -f "$dest/lib/index.js" || {
            echo '::error title=plugin::local-tickflow 的 lib/index.js 没落进包里'; exit 1; }
          test -f "$dest/sql/schema.sql" || {
            echo '::error title=plugin::local-tickflow 缺 sql/schema.sql，首次运行建不出表'; exit 1; }
          echo "local-tickflow size: $(du -sh "$dest" | cut -f1)"
          ls -la "$dest"

      - name: Give the built-in plugins Chinese names
        run: |
          # 插件面板显示的是 plugin package.json 里 dshGo.title 的中文名；
          # 没声明的（破甲、免费模型）会退回包名，看起来是一串英文包号。
          # 这里在打包前统一写上。用 python 改 JSON，避免 sed 在含 & 的
          # 字符串上出错。
          python3 - "$PWD/app/build/ios/iphoneos/Runner.app/builtin-plugins" <<"PY"
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          wanted = {
              "dsh-purge-community": ("破甲", "Purge", "shield"),
              "dsh-our-free-model": ("免费模型", "Free Models", "sparkles"),
              "@ccch1mneyyy/dsh-media": ("图像与视频", "Images and Video", "image"),
          }
          rc = 0
          for rel, (zh, en, icon) in wanted.items():
              f = root / rel / "package.json"
              if not f.is_file():
                  print(f"note: {rel} 不在包里，跳过")
                  continue
              pkg = json.loads(f.read_text(encoding="utf-8"))
              dsh = pkg.get("dshGo") or {"v": 1}
              dsh["title"] = {"zh": zh, "en": en}
              dsh.setdefault("icon", icon)
              # contributes 必须是对象：引擎侧 parseManifest 缺这个字段会标
              # valid:false，插件进不了贡献列表，插件面板里就没有它的入口。
              dsh.setdefault("contributes", {})
              pkg["dshGo"] = dsh
              f.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"{rel}: {zh}")
          # 三个只要有一个在包里就必须写成中文名
          for rel, (zh, _, _) in wanted.items():
              f = root / rel / "package.json"
              if not f.is_file():
                  continue
              rd = json.loads(f.read_text(encoding="utf-8")).get("dshGo", {})
              got = rd.get("title", {}).get("zh")
              if not isinstance(rd.get("contributes"), dict):
                  print(f"::error title=plugin:: {rel} 缺 contributes，面板里会没有入口")
                  rc = 1
              if got != zh:
                  print(f"::error title=plugin:: {rel} 的 title 没写成（{got!r}）")
                  rc = 1
          sys.exit(rc)
          PY

      - name: Verify every built-in plugin matches the Dart list
        run: |
          # 上线前最后一道闸：包里实际有的插件目录，必须和 Dart 侧
          # BuiltinPlugins.bundled 的清单一一对上。
          #
          # 破甲一直没被加载，根因就是这两边脱节：Dart 写 'dsh-purge'、
          # CI 打包成 'dsh-purge-community'。Dart 里 existsSync() 判否后
          # 静默 continue，构建照样成功、IPA 照样出包，装上去才发现插件没了。
          # 以前只在真机上才能发现，现在让它在 CI 里直接红。
          python3 - <<"PY"
          import pathlib, re, sys
          app = pathlib.Path("app")
          src = (app / "lib/runtime/builtin_plugins.dart").read_text(encoding="utf-8")
          block = re.search(r"static const List<String> bundled = \[(.*?)\];", src, re.S)
          if not block:
              print("::error title=plugin::builtin_plugins.dart 里找不到 bundled 清单"); sys.exit(1)
          # 去掉行注释，再抓引号里的目录名。
          body = "\n".join(l.split("//")[0] for l in block.group(1).splitlines())
          declared = re.findall(r"'([^']+)'", body)
          root = pathlib.Path("app/build/ios/iphoneos/Runner.app/builtin-plugins")
          rc = 0
          print("Dart 清单:", declared)
          for rel in declared:
              d = root / rel
              if not (d / "package.json").is_file():
                  print(f"::error title=plugin::Dart 要求 {rel}，但包里没有 {rel}/package.json"); rc = 1
              else:
                  print(f"  ok  {rel}")
          # 反向：包里有、Dart 没声明的，也提示出来（不算失败，可能是素材）。
          present = sorted(str(p.relative_to(root)) for p in root.rglob("package.json"))
          for rel in present:
              rel = rel[:-len("/package.json")] if rel != "package.json" else ""
              if rel and rel not in declared:
                  print(f"::warning title=plugin:: 包里有 {rel}，但 Dart 清单没声明，不会注入 profile")
          sys.exit(rc)
          PY
      - name: Sign with the HID entitlement
        run: |
          brew install ldid || true
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          app="app/build/ios/iphoneos/Runner.app"
          # platform-application 是整屏截图的前提（否则 UIGetScreenImage 只给全黑），
          # HID 用于点按与滑动，launchapplications 用于打开其它 App。
          # 刻意不带 no-sandbox：那个变体在 XinaA15 上会被 TrollStore 拒装。
          ent="app/ios/Runner/ent-platform.plist"
          test -f "$ent" || { echo '::error title=entitlements::missing'; exit 1; }
          echo "Frameworks embedded:"; ls "$app/Frameworks"
          echo "built-in plugin:"; du -sh "$app/builtin-plugins" 2>/dev/null || echo none
          # 只签主二进制：TrollStore 从这里读 entitlements 再签整包。
          # 绝不能对 App.framework/App 跑 ldid，Dart AOT 快照会校验失败。
          "$LLDID" -S"$ent" "$app/Runner"
          echo "=== entitlements ==="
          "$LLDID" -e "$app/Runner"
          for key in platform-application hid.client.event-dispatch springboard.launchapplications; do
            "$LLDID" -e "$app/Runner" | grep -q "$key" \
              || { echo "::error title=entitlements::$key did not land"; exit 1; }
          done
          rm -rf "$RUNNER_TEMP/ip"; mkdir -p "$RUNNER_TEMP/ip/Payload"
          cp -R "$app" "$RUNNER_TEMP/ip/Payload/"
          (cd "$RUNNER_TEMP/ip" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/DSH-Go.ipa")
          du -h "$RUNNER_TEMP/DSH-Go.ipa"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist" || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: |
            ${{ runner.temp }}/DSH-Go.ipa
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3

      # 只上传 artifact，不再自动发布 Release。
      # 需要直链时手动 gh release create。
