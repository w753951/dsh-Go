# Builds the app for a physical iPhone, unsigned, and packages it as an .ipa.
# Trimmed from the repository's own workflow: the simulator round trips are
# dropped, the iOS 15.0 deployment target is asserted, and the only artifact is
# the unsigned ipa a TrollStore device installs.
name: iOS build IPA

on:
  push:
    branches: ['feat/ios-**', 'ios/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DSH_IOS_ENGINE_WORK: ${{ github.workspace }}/../engine-work
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Prepare the engine
        run: |
          bash tooling/ios/prepare-engine.sh
          ls -la app/ios/Engine

      - name: Install the iSH build tools
        run: |
          brew install llvm lld
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install meson==1.7.2 ninja==1.11.1.4
          echo "$RUNNER_TEMP/ish-tools/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix lld)/bin:$PATH" ld.lld --version

      - name: Build the iSH guest frameworks for the device
        run: |
          out="app/ios/Engine/build/iphoneos/guest"
          bash tooling/ios/build-guest-addon.sh iphoneos "$out"
          ls -la "$out"

      - name: Build the engine native frameworks for the device
        run: |
          bash tooling/ios/build-engine-native.sh iphoneos "$RUNNER_TEMP/device"
          ls -la "$RUNNER_TEMP/device"

      - name: Install Flutter
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: Check the iOS 15.0 deployment target
        run: |
          pbx=app/ios/Runner.xcodeproj/project.pbxproj
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' "$pbx"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "$pbx" || {
            echo '::error title=deployment target::the app has no iOS 15.0 deployment target'; exit 1; }
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;' "$pbx" && \
            echo '::warning title=deployment target::16.0 is present; it must belong to the PhoneRunner target only'

      - name: Build the app for a device, unsigned
        working-directory: app
        run: bash ../tooling/ios/build.sh --release --no-codesign

      - name: Package the plain ipa
        run: |
          app="app/build/ios/iphoneos/Runner.app"
          test -d "$app" || { echo '::error title=ipa::no Runner.app was produced'; exit 1; }
          rm -rf "$RUNNER_TEMP/plain"; mkdir -p "$RUNNER_TEMP/plain/Payload"
          cp -R "$app" "$RUNNER_TEMP/plain/Payload/"
          (cd "$RUNNER_TEMP/plain" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/DSH-Go-plain.ipa")
          shasum -a 256 "$RUNNER_TEMP/plain/Payload/Runner.app/Runner"

      - name: Sign with codesign and ldid, package both
        run: |
          brew install ldid || true
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          app="app/build/ios/iphoneos/Runner.app"
          ent="app/ios/Runner/Runner.jailbreak.entitlements"
          test -f "$ent" || { echo '::error title=entitlements::missing'; exit 1; }

          # A：codesign（Apple 自家工具，只加 LC_CODE_SIGNATURE，不改别的段）
          cp -R "$app" "$RUNNER_TEMP/appC"
          codesign -f -s - --entitlements "$ent" "$RUNNER_TEMP/appC/Runner"
          echo "=== codesign entitlements ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/appC/Runner" 2>/dev/null || codesign -d --entitlements - "$RUNNER_TEMP/appC/Runner" 2>&1 | head -40
          rm -rf "$RUNNER_TEMP/ipC"; mkdir -p "$RUNNER_TEMP/ipC/Payload"
          cp -R "$RUNNER_TEMP/appC" "$RUNNER_TEMP/ipC/Payload/Runner.app"
          (cd "$RUNNER_TEMP/ipC" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/DSH-Go-codesign.ipa")
          shasum -a 256 "$RUNNER_TEMP/appC/Runner"

          # B：ldid（对照，确认是不是它破坏了二进制）
          cp -R "$app" "$RUNNER_TEMP/appL"
          "$LLDID" -S"$ent" "$RUNNER_TEMP/appL/Runner"
          echo "=== ldid entitlements ==="
          "$LLDID" -e "$RUNNER_TEMP/appL/Runner" | head -20
          rm -rf "$RUNNER_TEMP/ipL"; mkdir -p "$RUNNER_TEMP/ipL/Payload"
          cp -R "$RUNNER_TEMP/appL" "$RUNNER_TEMP/ipL/Payload/Runner.app"
          (cd "$RUNNER_TEMP/ipL" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/DSH-Go-ldid.ipa")
          shasum -a 256 "$RUNNER_TEMP/appL/Runner"

          echo "=== size compare ==="
          ls -l "$RUNNER_TEMP/appC/Runner" "$RUNNER_TEMP/appL/Runner" "$RUNNER_TEMP/plain/Payload/Runner.app/Runner"
          du -h "$RUNNER_TEMP"/DSH-Go-*.ipa

      - name: Upload every ipa
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: |
            ${{ runner.temp }}/DSH-Go-plain.ipa
            ${{ runner.temp }}/DSH-Go-codesign.ipa
            ${{ runner.temp }}/DSH-Go-ldid.ipa
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14