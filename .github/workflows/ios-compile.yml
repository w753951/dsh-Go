# Builds the app for a physical iPhone, unsigned, and packages it as an .ipa.
# Trimmed from the repository's own workflow: the simulator round trips are
# dropped, the iOS 15.0 deployment target is asserted, and the only artifact is
# the unsigned ipa a TrollStore device installs.
name: iOS build IPA

on:
  push:
    branches: ['feat/ios-**', 'ios/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DSH_IOS_ENGINE_WORK: ${{ github.workspace }}/../engine-work
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Prepare the engine
        run: |
          bash tooling/ios/prepare-engine.sh
          ls -la app/ios/Engine

      - name: Install the iSH build tools
        run: |
          brew install llvm lld
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install meson==1.7.2 ninja==1.11.1.4
          echo "$RUNNER_TEMP/ish-tools/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix lld)/bin:$PATH" ld.lld --version

      - name: Build the iSH guest frameworks for the device
        run: |
          out="app/ios/Engine/build/iphoneos/guest"
          bash tooling/ios/build-guest-addon.sh iphoneos "$out"
          ls -la "$out"

      - name: Build the engine native frameworks for the device
        run: |
          bash tooling/ios/build-engine-native.sh iphoneos "$RUNNER_TEMP/device"
          ls -la "$RUNNER_TEMP/device"

      - name: Install Flutter
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: Check the iOS 15.0 deployment target
        run: |
          pbx=app/ios/Runner.xcodeproj/project.pbxproj
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' "$pbx"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "$pbx" || {
            echo '::error title=deployment target::the app has no iOS 15.0 deployment target'; exit 1; }
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;' "$pbx" && \
            echo '::warning title=deployment target::16.0 is present; it must belong to the PhoneRunner target only'

      - name: Build the app for a device, unsigned
        working-directory: app
        run: bash ../tooling/ios/build.sh --release --no-codesign

      - name: Sign with jailbreak entitlements
        run: |
          brew install ldid || true
          LLDID="$(command -v ldid || echo /opt/homebrew/bin/ldid)"
          app="app/build/ios/iphoneos/Runner.app"
          ent="app/ios/Runner/Runner.jailbreak.entitlements"
          test -f "$ent" || { echo '::error title=entitlements::the jailbreak entitlements file is missing'; exit 1; }
          # TrollStore 会读取主二进制里的 entitlements 再自行签名，所以先把
          # platform-application / no-sandbox 写进 Runner 本身。
          "$LLDID" -S"$ent" "$app/Runner"
          echo "=== Runner entitlements ==="
          "$LLDID" -e "$app/Runner"
          # 嵌套 framework 与 dylib 一起签，真机 dyld 才肯加载。
          for fw in "$app"/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            name="$(basename "$fw" .framework)"
            [ -f "$fw/$name" ] && "$LLDID" -S"$ent" "$fw/$name" || true
          done
          for lib in "$app"/Frameworks/*.dylib; do
            [ -f "$lib" ] && "$LLDID" -S"$ent" "$lib" || true
          done
          echo "=== verify: no unsigned main binary ==="
          "$LLDID" -e "$app/Runner" | grep -q 'platform-application' \
            || { echo '::error title=entitlements::platform-application did not land in Runner'; exit 1; }
      - name: Package the unsigned ipa
        run: |
          app="app/build/ios/iphoneos/Runner.app"
          test -d "$app" || { echo '::error title=ipa::no Runner.app was produced'; exit 1; }
          echo "Frameworks embedded:"; ls app/build/ios/iphoneos/Runner.app/Frameworks || true
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/DSH-Go-unsigned.ipa")
          du -h "$RUNNER_TEMP/DSH-Go-unsigned.ipa"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist" || true

      - name: Upload the unsigned ipa
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/DSH-Go-unsigned.ipa
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
